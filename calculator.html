<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>План/Факт — простой опрос</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --text: #111827;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --field-bg: #ffffff;
      --field-border: #d1d5db;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary-bg: #ffffff;
      --secondary-border: #cbd5e1;
      --danger-bg: #fff1f2;
      --danger-border: #fecdd3;
      --success-bg: #16a34a;
      --success-bg-hover: #15803d;
      --success-shadow: 0 6px 16px rgba(22, 163, 74, 0.24);
      --focus: rgba(37, 99, 235, 0.2);
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      --radius-card: 16px;
      --radius-control: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius-card);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      animation: cardIn 0.28s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 11px;
      opacity: 0.88;
      line-height: 1.45;
    }

    .progress {
      display: inline-block;
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #334155;
      background: #eef2ff;
      border: 1px solid #dbe4ff;
      border-radius: 999px;
      padding: 5px 10px;
    }

    .question {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    textarea, input {
      width: 100%;
      border: 1px solid var(--field-border);
      background: var(--field-bg);
      color: var(--text);
      border-radius: var(--radius-control);
      padding: 13px 14px;
      font: inherit;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
    }

    textarea::placeholder,
    input::placeholder {
      color: #9ca3af;
    }

    textarea:focus,
    input:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px var(--focus);
      background: #ffffff;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    button {
      border: 1px solid var(--secondary-border);
      border-radius: 13px;
      padding: 12px 14px;
      min-height: 46px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #1f2937;
      background: var(--secondary-bg);
      box-shadow: none;
      transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease, opacity 0.2s ease;
      flex: 1 1 132px;
    }

    button:hover {
      transform: translateY(-1px);
      background: #f8fafc;
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--focus);
    }

    button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    button.secondary {
      background: var(--secondary-bg);
      color: #1f2937;
      border-color: var(--secondary-border);
      box-shadow: none;
    }

    button.secondary:hover {
      background: #f1f5f9;
      box-shadow: none;
    }

    button.danger {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: #be123c;
      box-shadow: none;
    }

    button.danger:hover {
      background: rgba(255, 107, 132, 0.25);
    }

    button.primary {
      color: #ffffff;
      border-color: transparent;
      background: var(--primary);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);
    }

    button.primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
    }

    .section {
      margin-top: 10px;
    }

    .hidden { display: none; }

    .result {
      min-height: 300px;
      white-space: pre-wrap;
      background: #ffffff;
      border-color: #bfdbfe;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .result:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
      background: #ffffff;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: #334155;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px 12px;
    }

    .status-item {
      font-size: 17px;
      line-height: 1.42;
      margin: -2px 0 12px;
      padding: 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .hint {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
    }

    #wizard,
    #final {
      display: grid;
      gap: 16px;
    }

    #final .question {
      font-size: 30px !important;
      margin-bottom: 2px;
      letter-spacing: -0.02em;
    }

    .final-shell {
      margin-top: 12px;
      background: #f8fbff;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      padding: 14px 12px 12px;
    }

    .final-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #1e3a8a;
      background: #dbeafe;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 5px 10px;
      margin-bottom: 8px;
    }

    .final-note {
      margin: 0 0 10px;
      font-size: 12px;
      color: #334155;
      font-weight: 600;
    }

    .week-summary {
      font-size: 12px;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 4px;
    }

    .bottom-actions {
      margin-top: 8px;
      justify-content: space-between;
    }

    .bottom-actions button {
      flex: 1 1 calc(50% - 8px);
    }

    #copyBtn {
      box-shadow: 0 14px 30px rgba(38, 70, 178, 0.5);
      min-height: 52px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    #copyBtn:hover {
      box-shadow: 0 12px 22px rgba(37, 99, 235, 0.35);
    }

    #copyBtn.success {
      background: var(--success-bg);
      border-color: transparent;
      box-shadow: var(--success-shadow);
    }

    #copyBtn.success:hover {
      background: var(--success-bg-hover);
      box-shadow: 0 14px 30px rgba(35, 134, 81, 0.5);
    }

    #status {
      font-size: 11px;
      opacity: 0.82;
    }

    @media (max-width: 540px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 30px;
      }

      .question {
        font-size: 25px;
      }

      button {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>План/Факт</h1>
    <p class="subtitle">Один вопрос -> один ответ -> итог.</p>

    <section id="wizard">
      <p id="progress" class="progress"></p>
      <p id="question" class="question"></p>

      <div id="dateBlock" class="hidden section">
        <input id="dayInput" type="number" min="1" max="31" placeholder="Число (например 8)">
      </div>

      <div id="textBlock" class="hidden section">
        <textarea id="textAnswer" placeholder="Напиши ответ..."></textarea>
      </div>

      <div id="listBlock" class="hidden section">
        <input id="listInput" placeholder="Пункт...">
        <p class="hint">Enter — добавить пункт</p>
        <div class="buttons" style="margin-bottom:10px">
          <button id="addItemBtn" class="primary" type="button">+ Добавить</button>
          <button id="removeLastItemBtn" class="secondary" type="button">↩ Удалить последний</button>
        </div>
        <div id="listPreview" class="status"></div>
      </div>

      <div id="statusBlock" class="hidden section">
        <p id="statusItemText" class="status-item"></p>
        <div class="buttons">
          <button id="markDoneBtn" class="primary" type="button">✅ Сделал</button>
          <button id="markNotDoneBtn" class="secondary" type="button">❌ Не сделал</button>
        </div>
      </div>

      <div id="weekModeBlock" class="hidden section">
        <div id="weekModePreview" class="week-summary" style="white-space:pre-wrap"></div>
        <div class="buttons">
          <button id="weekKeepBtn" class="primary" type="button">Оставляем</button>
          <button id="weekChangeBtn" class="secondary" type="button">Изменяем</button>
        </div>
      </div>

      <div class="buttons">
        <button id="prevBtn" class="secondary" type="button">Назад</button>
        <button id="nextBtn" class="primary" type="button">Далее</button>
        <button id="resetBtn" class="secondary danger" type="button">Очистить всё</button>
      </div>
    </section>

    <section id="final" class="hidden">
      <div class="final-shell">
        <p class="final-badge">✔ Готово</p>
        <p class="question" style="font-size:20px">Готово</p>
        <p class="final-note">Скопируй и отправь.</p>
        <textarea id="resultText" class="result" readonly></textarea>
        <div class="buttons bottom-actions">
          <button id="copyBtn" class="primary" type="button">Скопировать</button>
          <button id="whatsappBtn" class="secondary" type="button">Отправить в WhatsApp</button>
          <button id="telegramBtn" class="secondary" type="button">Отправить в Telegram</button>
        </div>
      </div>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script>
    const baseSteps = [
      { key: "prevReport", type: "text", q: "Вставь вчерашний план/факт (целиком, если есть)" },
      { key: "factDay", type: "day", q: "На какое число факт?" },
      { key: "planItems", type: "list", q: "Что планируешь сделать завтра? (добавляй через +)" },
      { key: "insights", type: "text", q: "Какой вывод на прошедший день?" },
      { key: "weekMode", type: "weekmode", q: "Блок недели (план + спорт + финансы)" },
      { key: "weekPlanEdit", type: "list", q: "Напиши новый план на неделю (добавляй через +)" },
      { key: "sport", type: "list", q: "Какая спортивная задача до конца недели? (добавляй через +)" },
      { key: "money", type: "text", q: "Какая финансовая цель до конца недели?" }
    ];

    const wizard = document.getElementById("wizard");
    const final = document.getElementById("final");
    const progress = document.getElementById("progress");
    const questionEl = document.getElementById("question");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const copyBtn = document.getElementById("copyBtn");
    const whatsappBtn = document.getElementById("whatsappBtn");
    const telegramBtn = document.getElementById("telegramBtn");
    const resultText = document.getElementById("resultText");
    const statusEl = document.getElementById("status");

    const dateBlock = document.getElementById("dateBlock");
    const textBlock = document.getElementById("textBlock");
    const listBlock = document.getElementById("listBlock");
    const dayInput = document.getElementById("dayInput");
    const textAnswer = document.getElementById("textAnswer");
    const listInput = document.getElementById("listInput");
    const listPreview = document.getElementById("listPreview");
    const addItemBtn = document.getElementById("addItemBtn");
    const removeLastItemBtn = document.getElementById("removeLastItemBtn");
    const statusBlock = document.getElementById("statusBlock");
    const statusItemText = document.getElementById("statusItemText");
    const markDoneBtn = document.getElementById("markDoneBtn");
    const markNotDoneBtn = document.getElementById("markNotDoneBtn");
    const weekModeBlock = document.getElementById("weekModeBlock");
    const weekModePreview = document.getElementById("weekModePreview");
    const weekKeepBtn = document.getElementById("weekKeepBtn");
    const weekChangeBtn = document.getElementById("weekChangeBtn");
    const resetBtn = document.getElementById("resetBtn");

    let step = 0;
    let steps = [...baseSteps];
    let previousPlanItems = [];
    let previousWeekPlanItems = [];
    let previousSport = "";
    let previousMoney = "";
    let statusChoices = {};
    const answers = {};
    for (const s of baseSteps) {
      answers[s.key] = s.type === "list" ? [] : "";
    }
    answers.done = [];
    answers.notDone = [];
    answers.weekPlan = [];

    function parsePreviousWeekPlanItems(rawText) {
      const lines = (rawText || "").split("\n").map((x) => x.trim());
      const start = lines.findIndex((line) => /^📅\s*План на неделю:?/i.test(line) || /^План на неделю:?/i.test(line));
      if (start === -1) return [];
      const result = [];
      for (let i = start + 1; i < lines.length; i += 1) {
        const line = lines[i];
        if (!line) continue;
        if (/^Ключевая задача:?$/i.test(line) || /^2 бизнес задачи:?$/i.test(line) || /^Спортивная задача:?/i.test(line) || /^Финансовая цель:?/i.test(line)) break;
        const cleaned = line.replace(/^[-•]\s*/, "").replace(/^[✅❌]\s*/, "").trim();
        if (cleaned) result.push(cleaned);
      }
      return result;
    }

    function parsePreviousSport(rawText) {
      const lines = (rawText || "").split("\n").map((x) => x.trim());
      const line = lines.find((x) => /^Спортивная задача:/i.test(x));
      if (!line) return "";
      return line.replace(/^Спортивная задача:\s*/i, "").replace(/^[✅❌]\s*/, "").trim();
    }

    function parsePreviousMoney(rawText) {
      const lines = (rawText || "").split("\n").map((x) => x.trim());
      const line = lines.find((x) => /^Финансовая цель:/i.test(x));
      if (!line) return "";
      return line.replace(/^Финансовая цель:\s*/i, "").replace(/^[✅❌]\s*/, "").trim();
    }

    function getDateByDay(dayNumber) {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const d = Math.min(Math.max(Number(dayNumber) || now.getDate(), 1), daysInMonth);
      return new Date(y, m, d);
    }

    function formatDM(dateObj) {
      return `${dateObj.getDate()}.${dateObj.getMonth() + 1}`;
    }

    function addListItem(targetKey, rawValue) {
      const value = (rawValue || "").trim();
      if (!value || !Array.isArray(answers[targetKey])) return false;
      const exists = answers[targetKey].some((item) => item.toLowerCase() === value.toLowerCase());
      if (exists) return false;
      answers[targetKey].push(value);
      return true;
    }

    function saveCurrentStep() {
      const current = steps[step];
      if (current.type === "day") answers[current.key] = dayInput.value.trim();
      if (current.type === "text") answers[current.key] = textAnswer.value.trim();
      if (current.type === "list") {
        if (addListItem(current.key, listInput.value)) {
          listInput.value = "";
        }
      }
    }

    function parsePreviousPlanItems(rawText) {
      const lines = (rawText || "").split("\n").map((x) => x.trim());
      const start = lines.findIndex((line) => /^📋\s*План на/i.test(line) || /^План на/i.test(line));
      if (start === -1) return [];
      const result = [];
      for (let i = start + 1; i < lines.length; i += 1) {
        const line = lines[i];
        if (!line) continue;
        if (/^выводы:?$/i.test(line) || /^📅\s*План на неделю/i.test(line)) break;
        const cleaned = line.replace(/^[-•]\s*/, "").replace(/^[✅❌]\s*/, "").trim();
        if (cleaned) result.push(cleaned);
      }
      return result;
    }

    function rebuildStepsWithStatuses() {
      previousPlanItems = parsePreviousPlanItems(answers.prevReport);
      previousWeekPlanItems = parsePreviousWeekPlanItems(answers.prevReport);
      previousSport = parsePreviousSport(answers.prevReport);
      previousMoney = parsePreviousMoney(answers.prevReport);
      statusChoices = {};
      answers.done = [];
      answers.notDone = [];
      answers.weekPlan = [];
      const statusSteps = previousPlanItems.map((item, idx) => ({
        key: `status_${idx}`,
        type: "status",
        q: `Ты сделал это?`,
        item,
        statusKey: `day_${idx}`
      }));
      const weekStatusSteps = previousWeekPlanItems.map((item, idx) => ({
        key: `week_status_${idx}`,
        type: "status",
        q: `Ты сделал недельную задачу?`,
        item: `📅 ${item}`,
        statusKey: `week_${idx}`
      }));
      const sportStatusSteps = previousSport
        ? [{
            key: "sport_status",
            type: "status",
            q: "Спортивная задача выполнена?",
            item: `🏃 ${previousSport}`,
            statusKey: "sport"
          }]
        : [];
      const moneyStatusSteps = previousMoney
        ? [{
            key: "money_status",
            type: "status",
            q: "Финансовая цель выполнена?",
            item: `💰 ${previousMoney}`,
            statusKey: "money"
          }]
        : [];

      const allStatusSteps = [
        ...statusSteps,
        ...weekStatusSteps,
        ...sportStatusSteps,
        ...moneyStatusSteps
      ];

      const dynamicBaseSteps = [...baseSteps];

      const indexAfterFact = 2;
      steps = [
        ...dynamicBaseSteps.slice(0, indexAfterFact),
        ...allStatusSteps,
        ...dynamicBaseSteps.slice(indexAfterFact)
      ];
    }

    function renderListPreview(items) {
      if (!items.length) {
        listPreview.textContent = "Пока пусто. Впиши пункт и нажми +";
        return;
      }
      listPreview.textContent = items.map((x, i) => `${i + 1}) ${x}`).join("\n");
      listPreview.style.whiteSpace = "pre-wrap";
    }

    function renderStep() {
      const current = steps[step];
      progress.textContent = `Прогресс: ${step + 1} / ${steps.length}`;
      questionEl.textContent = current.q;
      prevBtn.disabled = step === 0;
      nextBtn.textContent = step === steps.length - 1 ? "Готово" : "Далее";
      nextBtn.disabled = current.type === "status" || current.type === "weekmode";
      nextBtn.classList.toggle("hidden", current.type === "status" || current.type === "weekmode");

      dateBlock.classList.add("hidden");
      textBlock.classList.add("hidden");
      listBlock.classList.add("hidden");
      statusBlock.classList.add("hidden");
      weekModeBlock.classList.add("hidden");

      if (current.type === "day") {
        dateBlock.classList.remove("hidden");
        dayInput.max = String(new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate());
        dayInput.value = answers[current.key] || "";
        dayInput.focus();
      }
      if (current.type === "text") {
        textBlock.classList.remove("hidden");
        if (current.key === "money" && !answers[current.key] && previousMoney) {
          textAnswer.value = previousMoney;
        } else {
          textAnswer.value = answers[current.key] || "";
        }
        textAnswer.focus();
      }
      if (current.type === "list") {
        listBlock.classList.remove("hidden");
        listInput.value = "";
        if (current.key === "sport" && (!answers[current.key] || !answers[current.key].length) && previousSport) {
          answers[current.key] = [previousSport];
        }
        renderListPreview(answers[current.key]);
        listInput.focus();
      }
      if (current.type === "status") {
        statusBlock.classList.remove("hidden");
        statusItemText.textContent = current.item;
      }
      if (current.type === "weekmode") {
        weekModeBlock.classList.remove("hidden");
        const hasPreviousWeekBlock = previousWeekPlanItems.length || previousSport || previousMoney;
        if (hasPreviousWeekBlock) {
          questionEl.textContent = "Блок недели: оставляем прошлый или изменяем?";
          const previewLines = [
            `Спорт: ${previousSport || "—"}`,
            `Финансы: ${previousMoney || "—"}`,
            `План: ${previousWeekPlanItems.length ? previousWeekPlanItems.join("; ") : "—"}`
          ];
          weekModePreview.classList.remove("hidden");
          weekModePreview.textContent = previewLines.join("\n");
          weekKeepBtn.textContent = "Оставить";
          weekChangeBtn.textContent = "Изменяем";
        } else {
          questionEl.textContent = "Блока недели нет. Добавим новый?";
          weekModePreview.classList.add("hidden");
          weekKeepBtn.textContent = "Заполнить новый";
          weekChangeBtn.textContent = "Пропустить";
        }
      }
    }

    function buildResult() {
      const factBase = getDateByDay(answers.factDay);
      const planBase = new Date(factBase);
      planBase.setDate(factBase.getDate() + 1);
      const isWeekOver = factBase.getDay() === 0;

      answers.done = previousPlanItems
        .filter((_, idx) => statusChoices[`day_${idx}`] === "done");
      answers.notDone = previousPlanItems
        .filter((_, idx) => statusChoices[`day_${idx}`] === "notdone");
      const weekDone = previousWeekPlanItems
        .filter((_, idx) => statusChoices[`week_${idx}`] === "done")
        .map((x) => `📅 ${x}`);
      const weekNotDoneRaw = previousWeekPlanItems
        .filter((_, idx) => statusChoices[`week_${idx}`] === "notdone")
        .map((x) => `📅 ${x}`);
      const weekNotDone = isWeekOver ? weekNotDoneRaw : [];
      const weekInProgress = isWeekOver ? [] : weekNotDoneRaw;
      const remainingPreviousWeekPlanItems = previousWeekPlanItems
        .filter((_, idx) => statusChoices[`week_${idx}`] !== "done");
      const sportDone = previousSport && statusChoices.sport === "done" ? [`🏃 ${previousSport}`] : [];
      const sportNotDone = previousSport && statusChoices.sport === "notdone" && isWeekOver ? [`🏃 ${previousSport}`] : [];
      const sportInProgress = previousSport && statusChoices.sport === "notdone" && !isWeekOver ? [`🏃 ${previousSport}`] : [];
      const moneyDone = previousMoney && statusChoices.money === "done" ? [`💰 ${previousMoney}`] : [];
      const moneyNotDone = previousMoney && statusChoices.money === "notdone" && isWeekOver ? [`💰 ${previousMoney}`] : [];
      const moneyInProgress = previousMoney && statusChoices.money === "notdone" && !isWeekOver ? [`💰 ${previousMoney}`] : [];
      const planItems = answers.planItems.map((x) => `- ${x}`).join("\n") || "-";
      const editedWeekPlan = Array.isArray(answers.weekPlanEdit) ? answers.weekPlanEdit : [];
      const finalWeekPlan = answers.weekPlan.length ? answers.weekPlan : (editedWeekPlan.length ? editedWeekPlan : remainingPreviousWeekPlanItems);
      const weekPlan = finalWeekPlan.map((x) => `- ${x}`).join("\n") || "-";
      const fallbackSport = statusChoices.sport === "done" ? "" : previousSport;
      const fallbackMoney = statusChoices.money === "done" ? "" : previousMoney;
      const finalSport = answers.sport.length ? answers.sport.join(", ") : (fallbackSport || "-");
      const finalMoney = (answers.money || "").trim() || fallbackMoney || "-";

      const factLines = [
        ...answers.done.map((x) => `✅ ${x}`),
        ...weekDone.map((x) => `✅ ${x}`),
        ...sportDone.map((x) => `✅ ${x}`),
        ...moneyDone.map((x) => `✅ ${x}`),
        ...weekInProgress.map((x) => `⏳ ${x} (в процессе)`),
        ...sportInProgress.map((x) => `⏳ ${x} (в процессе)`),
        ...moneyInProgress.map((x) => `⏳ ${x} (в процессе)`),
        ...answers.notDone.map((x) => `❌ ${x}`),
        ...weekNotDone.map((x) => `❌ ${x}`),
        ...sportNotDone.map((x) => `❌ ${x}`),
        ...moneyNotDone.map((x) => `❌ ${x}`)
      ];

      return [
        `➡️ Факт ${formatDM(factBase)}`,
        "",
        factLines.join("\n") || "-",
        "",
        `📋 План на ${formatDM(planBase)}`,
        "",
        planItems,
        "",
        "Выводы:",
        answers.insights || "-",
        "",
        "📅 План на неделю:",
        weekPlan,
        "",
        `Спортивная задача: ${finalSport}`,
        `Финансовая цель: ${finalMoney}`
      ].join("\n");
    }

    function openFinalScreen() {
      const finalText = buildResult();
      resultText.value = finalText;
      wizard.classList.add("hidden");
      final.classList.remove("hidden");
      statusEl.textContent = "Проверь текст и нажми «Скопировать».";
    }

    function resetAll() {
      step = 0;
      steps = [...baseSteps];
      previousPlanItems = [];
      previousWeekPlanItems = [];
      previousSport = "";
      previousMoney = "";
      statusChoices = {};
      for (const s of baseSteps) {
        answers[s.key] = s.type === "list" ? [] : "";
      }
      answers.done = [];
      answers.notDone = [];
      answers.weekPlan = [];
      resultText.value = "";
      statusEl.textContent = "";
      final.classList.add("hidden");
      wizard.classList.remove("hidden");
      renderStep();
    }

    addItemBtn.addEventListener("click", () => {
      const current = steps[step];
      if (current.type !== "list") return;
      if (!addListItem(current.key, listInput.value)) return;
      listInput.value = "";
      renderListPreview(answers[current.key]);
      listInput.focus();
    });

    removeLastItemBtn.addEventListener("click", () => {
      const current = steps[step];
      if (!current || current.type !== "list") return;
      if (!answers[current.key].length) return;
      answers[current.key].pop();
      renderListPreview(answers[current.key]);
      listInput.focus();
    });

    listInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addItemBtn.click();
      }
    });

    textAnswer.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      const current = steps[step];
      if (!current || current.type !== "text") return;
      event.preventDefault();
      nextBtn.click();
    });

    dayInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      nextBtn.click();
    });

    prevBtn.addEventListener("click", () => {
      saveCurrentStep();
      if (step > 0) step -= 1;
      renderStep();
    });

    nextBtn.addEventListener("click", () => {
      saveCurrentStep();
      if (steps[step] && steps[step].key === "factDay") {
        rebuildStepsWithStatuses();
      }
      if (steps[step] && steps[step].key === "weekMode") {
        return;
      }
      if (step < steps.length - 1) {
        step += 1;
        renderStep();
        return;
      }
      openFinalScreen();
    });

    markDoneBtn.addEventListener("click", () => {
      const current = steps[step];
      if (!current || current.type !== "status") return;
      statusChoices[current.statusKey] = "done";
      step = Math.min(step + 1, steps.length - 1);
      renderStep();
    });

    markNotDoneBtn.addEventListener("click", () => {
      const current = steps[step];
      if (!current || current.type !== "status") return;
      statusChoices[current.statusKey] = "notdone";
      step = Math.min(step + 1, steps.length - 1);
      renderStep();
    });

    weekKeepBtn.addEventListener("click", () => {
      const hasPreviousWeekBlock = previousWeekPlanItems.length || previousSport || previousMoney;
      if (!hasPreviousWeekBlock) {
        answers.weekPlan = [];
        answers.weekPlanEdit = [];
        answers.sport = [];
        answers.money = "";
        step = Math.min(step + 1, steps.length - 1);
        renderStep();
        return;
      }
      answers.weekPlan = previousWeekPlanItems
        .filter((_, idx) => statusChoices[`week_${idx}`] !== "done");
      answers.weekPlanEdit = [];
      answers.sport = previousSport && statusChoices.sport !== "done" ? [previousSport] : [];
      answers.money = previousMoney && statusChoices.money !== "done" ? previousMoney : "";
      openFinalScreen();
    });

    weekChangeBtn.addEventListener("click", () => {
      answers.weekPlan = [];
      answers.weekPlanEdit = [];
      answers.sport = [];
      answers.money = "";
      step = Math.min(step + 1, steps.length - 1);
      renderStep();
    });

    resetBtn.addEventListener("click", () => {
      if (!confirm("Очистить все ответы и начать заново?")) return;
      resetAll();
    });

    let copyResetTimer = null;

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(resultText.value);
        if (copyResetTimer) {
          clearTimeout(copyResetTimer);
        }
        copyBtn.textContent = "Скопировано";
        copyBtn.classList.add("success");
        statusEl.textContent = "Скопировано. Форма очищена для нового отчета.";
        copyResetTimer = setTimeout(() => {
          copyBtn.textContent = "Скопировать";
          copyBtn.classList.remove("success");
          copyResetTimer = null;
        }, 1500);
      } catch (e) {
        statusEl.textContent = "Не получилось скопировать автоматически. Скопируй вручную.";
      }
    });

    whatsappBtn.addEventListener("click", () => {
      const encodedText = encodeURIComponent(resultText.value || "");
      window.open(`https://wa.me/?text=${encodedText}`, "_blank");
    });

    telegramBtn.addEventListener("click", () => {
      const encodedText = encodeURIComponent(resultText.value || "");
      window.open(`https://t.me/share/url?url=&text=${encodedText}`, "_blank");
    });

    renderStep();
  </script>
</body>
</html>
